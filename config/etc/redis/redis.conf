# Redis configuration file.

################################## INCLUDES ###################################

# include /path/to/local.conf
# include /path/to/other.conf

################################## MODULES #####################################

# loadmodule /path/to/my_module.so
# loadmodule /path/to/other_module.so

################################## NETWORK #####################################

bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
unixsocket /run/redis/redis-server.sock
unixsocketperm 770
timeout 0
tcp-keepalive 300

################################# TLS/SSL #####################################

# port 0
# tls-port 6379
# tls-cert-file redis.crt
# tls-key-file redis.key
# tls-dh-params-file redis.dh
# tls-ca-cert-file ca.crt
# tls-ca-cert-dir /etc/ssl/certs
# tls-auth-clients no
# tls-auth-clients optional
# tls-auth-clients-user CN
# tls-replication yes
# tls-cluster yes
# tls-expected-peer-name node.my-redis-cluster.example.com
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers DEFAULT:!MEDIUM
# tls-ciphersuites TLS_CHACHA20_POLY1305_SHA256
# tls-groups prime256v1
# tls-prefer-server-ciphers yes
# tls-session-caching no
# tls-session-cache-size 5000
# tls-session-cache-timeout 60

################################# GENERAL #####################################

daemonize no
supervised systemd
# pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
# syslog-enabled no
# syslog-ident redis
# syslog-facility local0
databases 128
always-show-logo yes

################################ SNAPSHOTTING  ################################
# Redis is used as a volatile WordPress object cache; MariaDB is the durable store.
save ""
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-del-sync-files no
dir /var/lib/redis

################################# REPLICATION #################################

# replicaof <masterip> <masterport>
# masterauth <master-password>
# masteruser <username>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-diskless-load disabled
# repl-ping-replica-period 10
# repl-timeout 60
repl-disable-tcp-nodelay no
# repl-backlog-size 1mb
# repl-backlog-ttl 3600
# replica-full-sync-buffer-limit 0
replica-priority 100
# min-replicas-to-write 3
# min-replicas-max-lag 10
# repl-compression 0
# repl-compression-max-latency 100
# replica-announce-ip 5.5.5.5
# replica-announce-port 1234

############################### KEYS TRACKING #################################

# tracking-table-max-keys 1000000

################################## SECURITY ###################################

acllog-max-len 128
# aclfile /etc/redis/users.acl
# requirepass foobared

################################### CLIENTS ####################################

# maxclients 10000

############################## MEMORY MANAGEMENT ################################

maxmemory SEDREDISMAXMEMmb
maxmemory-policy allkeys-lru
# maxmemory-samples 5
# replica-ignore-maxmemory yes
# active-expire-effort 1

############################# LAZY FREEING ####################################

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

################################ THREADED I/O #################################

# io-threads 4

############################ KERNEL OOM CONTROL ##############################

oom-score-adj no
oom-score-adj-values 0 200 800

############################## APPEND ONLY MODE ###############################

appendonly no
appendfilename "appendonly.aof"
# appendfsync always
appendfsync everysec
# appendfsync no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
# aof-load-corrupt-tail-max-size 4096
aof-use-rdb-preamble yes

############################### BACKUP / RESTORE ##############################

# The commented values below are Redis 8's defaults. They stay commented so this file also
# works with Redis 7, which does not know these settings and refuses to start on them.
# backupdirname "backupdir"
# backup-sealed-ttl 0
# preload-file aof:/tmp/restore-backup/appendonly.aof.manifest
# preload-file rdb:/tmp/backup-to-recover.rdb
# preload-file aof:/tmp/appendonly.aof

################################ LUA SCRIPTING  ###############################

busy-reply-threshold 5000

################################ REDIS CLUSTER  ###############################

# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-bus-port-protected-mode no
# cluster-replica-validity-factor 10
# cluster-migration-barrier 1
# cluster-require-full-coverage yes
# cluster-replica-no-failover no
# cluster-allow-reads-when-down no
# cluster-compatibility-sample-ratio 0
# cluster-slot-stats-enabled no
# cluster-slot-migration-write-pause-timeout 10000
# cluster-slot-migration-handoff-max-lag-bytes 1mb

########################## CLUSTER DOCKER/NAT support  ########################

# * cluster-announce-ip
# * cluster-announce-port
# * cluster-announce-bus-port
# cluster-announce-ip 10.1.1.5
# cluster-announce-port 6379
# cluster-announce-bus-port 6380

################################## SLOW LOG ###################################

slowlog-log-slower-than 10000
slowlog-max-len 128
# slowlog-entry-max-argc 32
# slowlog-entry-max-string-len 128

################################ LATENCY MONITOR ##############################

latency-monitor-threshold 0

############################# EVENT NOTIFICATION ##############################

notify-keyspace-events ""

############################### ADVANCED CONFIG ###############################

hash-max-listpack-entries 512
hash-max-listpack-value 64
# The commented values below are Redis 8's defaults. They stay commented so this file also
# works with Redis 7, which does not know these settings and refuses to start on them.
# hash-min-template-entries 0
# hash-max-template-entries 0
# hash-rdb-load-min-template-entries 0
# hash-rdb-load-max-template-entries 0
# hash-rdb-load-template-disassembly-threshold 0
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
# stream-idmp-duration 100
# stream-idmp-maxsize 100
# Redis 8 defaults (commented for Redis 7, as above)
# array-slice-size 4096
# array-sparse-kmax 10
# array-sparse-kmin 5
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
# lookahead 16
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
# key-memory-histograms no
# lfu-log-factor 10
# lfu-decay-time 1

########################### ACTIVE DEFRAGMENTATION #######################

# Reclaim memory lost to fragmentation (an evicting cache churns keys). With Redis's default
# thresholds below it starts only above 100 MB wasted and 10% fragmentation.
activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 1
# active-defrag-cycle-max 25
# active-defrag-max-scan-fields 1000
jemalloc-bg-thread yes
# server_cpulist 0-7:2
# bio_cpulist 1,3
# aof_rewrite_cpulist 8-11
# bgsave_cpulist 1,10-11
# ignore-warnings ARM64-COW-BUG
