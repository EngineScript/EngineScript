# EngineScript: an address that fails to log in over SSH 5 times within 10 minutes is banned
# for an hour. Read after Ubuntu's defaults-debian.conf, so these settings win; put your own
# changes in /etc/fail2ban/jail.local, which EngineScript does not replace.
#
# See the bans with: fail2ban-client status sshd
# Lift one with:     fail2ban-client set sshd unbanip <address>

[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h
