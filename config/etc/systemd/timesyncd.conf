# EngineScript: systemd-timesyncd syncs with Cloudflare's time server first, then Ubuntu's pool.
# Used on Ubuntu 24.04; Ubuntu 26.04 uses chrony with its own time servers instead.
# The commented lines show systemd's defaults. See timesyncd.conf(5) for details.

[Time]
NTP=time.cloudflare.com 0.ubuntu.pool.ntp.org 1.ubuntu.pool.ntp.org 2.ubuntu.pool.ntp.org 3.ubuntu.pool.ntp.org
FallbackNTP=ntp.ubuntu.com
#RootDistanceMaxSec=5
#PollIntervalMinSec=32
#PollIntervalMaxSec=2048
