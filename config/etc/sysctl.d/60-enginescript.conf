# EngineScript kernel settings. Only settings that differ from the kernel's (or Ubuntu's)
# defaults and have a reason are listed; audited and benchmarked in October 2026.

### SYSTEM SECURITY ###

# Disable the magic SysRq key
kernel.sysrq = 0

# Append the PID to core dump file names
kernel.core_uses_pid = 1

# Full address space layout randomization
kernel.randomize_va_space = 2

# No core dumps from setuid programs
fs.suid_dumpable = 0

# Hide kernel pointers and kernel logs from unprivileged users
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# Restrict ptrace to parent processes
kernel.yama.ptrace_scope = 1

# Protect hard and symbolic links in world-writable directories
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

### MEMORY ###

# Swap only as a last resort, so the database and caches stay in RAM
vm.swappiness = 10

# Start writing dirty pages to disk earlier, so writers are not stalled by large flushes
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Protect the bottom 64 KiB from unprivileged mmap allocations
vm.mmap_min_addr = 65536

# Never refuse memory requests (Redis asks for this); if memory runs out, the OOM killer picks a
# PHP-FPM worker before Redis and MariaDB (their systemd overrides set OOMScoreAdjust)
vm.overcommit_memory = 1

# Default balance between reclaiming the file cache and application memory
vm.vfs_cache_pressure = 100

# Asynchronous I/O requests, for MariaDB when it cannot use io_uring
fs.aio-max-nr = 1048576

### NETWORK SECURITY ###

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 4
net.ipv4.tcp_max_syn_backlog = 3072

# Not a router: no packet forwarding
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.default.forwarding = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

# No source routing, no sending or accepting ICMP redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Strict reverse path filtering (spoofed source addresses) and logging of spoofed packets
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Don't proxy ARP for anyone
net.ipv4.conf.all.proxy_arp = 0

# Protect against TIME-WAIT assassination (RFC 1337)
net.ipv4.tcp_rfc1337 = 1

# Ignore IPv6 router advertisements in the kernel (Ubuntu's systemd-networkd handles them)
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.all.accept_ra_defrtr = 0
net.ipv6.conf.all.accept_ra_pinfo = 0
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.default.accept_ra_defrtr = 0
net.ipv6.conf.default.accept_ra_pinfo = 0
net.ipv6.conf.default.autoconf = 0

# Close dead connections sooner: FIN-WAIT-2 after 15 s; keep-alive probes after 5 minutes idle
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

### NETWORK PERFORMANCE ###

# BBR congestion control with the fq scheduler. Benchmarked: about 10-20x the throughput of
# cubic (the default) on a path with 80 ms and 1% packet loss
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Keep little unsent data in each socket, so responses multiplexed on one HTTP/2 connection
# (Cloudflare's connections to the origin) are not queued behind a large one. Benchmarked: small
# pages p90 107 ms against 157 ms while a large download shared the connection
net.ipv4.tcp_notsent_lowat = 16384

# Keep the congestion window of idle keep-alive connections (Cloudflare reuses them).
# Benchmarked: a 500 KB page after a 3 s idle gap in 15 ms against 65 ms
net.ipv4.tcp_slow_start_after_idle = 0

# Path MTU probing, for paths that drop ICMP "fragmentation needed" messages
net.ipv4.tcp_mtu_probing = 1

# Socket buffer sizes programs may request (for example for HTTP/3 over UDP)
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

