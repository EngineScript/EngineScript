# Use cached or actual files if they exist. Otherwise pass request to WordPress.
location / {
  try_files $uri $uri/ /index.php?$args;
}

# Feeds and sitemaps: cached for 30 minutes instead of the pages' 3 hours. Bots request them often,
# and a new post shows in them within 30 minutes. A file that exists is served as it is.
location ~* (?:/feed(?:/(?:atom|rdf|rss2?))?/?|sitemap[^/]*\.(?:x[ms]l|html))$ {
  try_files $uri @es_feed;
}

location @es_feed {
  # WordPress's index.php in this location (not a redirect to the PHP location and its 3 hours);
  # WordPress reads the address from REQUEST_URI, which keeps the original
  rewrite ^ /index.php break;
  include /etc/nginx/globals/php-fpm.conf;
  fastcgi_cache_valid 200 30m;
}
