# Rules for static file types
#
# These locations set Cache-Control themselves, so "expires off" stops the
# expires map (map-expires.conf) from adding a second, conflicting header.
# The long-lived Cache-Control headers omit "always", so error responses
# such as 404s are not cached for a year.
# Security headers come from nginx.conf (add_header_inherit merge).

# robots.txt
# Serve a physical robots.txt when one exists. Otherwise pass the request to
# WordPress, which generates a virtual robots.txt (also used by SEO plugins).
location = /robots.txt {
  access_log off;
  expires off;
  add_header Cache-Control "public, max-age=3600";
  log_not_found off;
  try_files $uri /index.php?$args;
}

# Common Web Files and Documents
location ~* \.(?:3gp|7z|a(ac|png|s[fx]|vi(fs?)?)|b(mp|r|z2)|c(ast|ur)|do[ct][mx]?|flv|g(if|z)|h(eic|tc)|i[cs]o|jpe?g|m(4a|idi?|ov|p(3|4|e?g))|og[gv]|p(df|ls|ng|[op][st][mx]?)|rar|swf|t(ar|gz|iff?)|uha|w([am]v|eb[mp])|xl[st][mx]?)$ {
  access_log off;
  expires off;
  add_header Cache-Control "public, max-age=31536000, immutable";
  log_not_found off;
}

# Web Fonts
location ~* \.(?:eot|otf|svgz?|tt[cf]|woff2?)$ {
  access_log off;
  expires off;
  add_header Cache-Control "public, max-age=31536000, immutable";
  log_not_found off;
}

# Jetpack Boost Concatenated Files
# Keep direct file serving when files exist and pass missing files to WordPress.
location ~* ^/wp-content/boost-cache/static/.*\.(?:css|js)(\.map)?$ {
  access_log off;
  expires off;
  add_header Cache-Control "public, max-age=31536000, immutable";
  log_not_found off;
  try_files $uri /index.php?$args;
}

# Javascript & CSS
# Intentionally no try_files fallback here:
# missing generic assets should return Nginx 404s directly for performance and clean troubleshooting.
# Jetpack Boost-specific fallback is handled by the dedicated /wp-content/boost-cache/static/ location above.
location ~* \.(?:css|js)(\.map)?$ {
  access_log off;
  expires off;
  add_header Cache-Control "public, max-age=31536000, immutable";
  log_not_found off;
}

# HTML & Text files
#location ~* \.(?:html?|txt)$ {
  #access_log /dev/null;
  #expires 1d;
  #log_not_found off;
#}

# Zip Archives - disable FastCGI buffering for PHP-served downloads
# Regex locations are checked in order, so .zip must not also be listed in the
# "Common Web Files" location above, or this location never applies.
location ~* \.zip$ {
  expires off;
  add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
  fastcgi_buffering off;
  fastcgi_max_temp_file_size 0;
}
