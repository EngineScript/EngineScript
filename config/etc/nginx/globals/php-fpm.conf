# Check that the PHP script exists before passing it
try_files $uri $uri/ /index.php?$args;

# Remove Set-Cookie headers from cacheable responses, so a cookie stored in the
# cache is never sent to other visitors. Visitors with WooCommerce or login
# cookies bypass the cache ($es_http_cookie in map-cache.conf), and responses
# that set those cookies are never stored ($es_no_cache_setcookie).
if ($skip_cache = 0) {
  more_clear_headers "Set-Cookie*";
}

# FastCGI cache key
fastcgi_cache_key "$scheme$request_method$host$request_uri$http_x_http_method_override";

# Pass upstream 103 Early Hints only for eligible clients.
early_hints $es_early_hints;

# Include FastCGI Configuration
include /etc/nginx/globals/fastcgi-modified.conf;
fastcgi_index index.php;

# Exploit Mitigation
fastcgi_param HTTP_PROXY "";

fastcgi_cache EngineScriptWP;

# PHP-FPM Processing
fastcgi_pass unix:/run/php/phpSEDPHPVER-fpm.sock;
