# PHP for the admin subdomain: the control panel's api.php and the admin tools.
# Unlike php-fpm.conf, which is written for the WordPress sites, it has no FastCGI
# cache, no cookie handling, and no fallback to /index.php: a PHP file that does
# not exist answers 404.

# Check that the PHP script exists before passing it
try_files $uri =404;

# Keep the Cache-Control that PHP sends (the API's "no-store", the tools' own headers):
# the expires map in nginx.conf would replace it based on the content type.
expires off;

# Include FastCGI Configuration
include /etc/nginx/globals/fastcgi-modified.conf;
fastcgi_index index.php;

# Exploit Mitigation
fastcgi_param HTTP_PROXY "";

# PHP-FPM Processing
fastcgi_pass unix:/run/php/phpSEDPHPVER-fpm.sock;
