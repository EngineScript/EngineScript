# SSL Settings
ssl_buffer_size 4k;
# TLS 1.2 ciphers offered by both Cloudflare (origin connections) and Mozilla's guidelines.
# TLS 1.3 uses OpenSSL's default suites, which Cloudflare also supports.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
# kTLS offloads TLS encryption to the kernel; requires CONFIG_TLS in kernel and OpenSSL built with kTLS support
ssl_conf_command Options KTLS;
# X25519MLKEM768 is a hybrid post-quantum key exchange (OpenSSL 3.5 or newer)
ssl_ecdh_curve X25519MLKEM768:X25519:P-256:P-384;
ssl_prefer_server_ciphers off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_reject_handshake off;
ssl_session_cache shared:SSL:5m;
ssl_session_tickets on;
ssl_session_timeout 6h;
ssl_verify_client off;

# OCSP Stapling (disabled)
# Behind Cloudflare, visitors never receive the origin certificate, so stapling has no
# benefit. Nginx's default is off. To enable it, uncomment these four lines and the
# ssl_trusted_certificate line in each vhost. The resolver is only used for stapling.
# ZeroSSL certificates include an OCSP responder; Let's Encrypt ended OCSP in 2025.
#resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 [2001:4860:4860::8888] [2001:4860:4860::8844] [2606:4700:4700::1111] [2606:4700:4700::1001] [2620:119:35::35] [2620:119:53::53] valid=10m;
#resolver_timeout 5s;
#ssl_stapling on;
#ssl_stapling_verify on;

# SSL Early Data
proxy_set_header Early-Data $ssl_early_data;

# References:
# https://ssl-config.mozilla.org/guidelines/latest.json
# https://wiki.mozilla.org/Security/Server_Side_TLS
# https://linuxblog.io/nginx-tuning-tips-tls-ssl-https-ttfb-latency/
# https://developers.cloudflare.com/ssl/origin-configuration/cipher-suites/