# Default virtual domain file for your Nginx server.
#
# HTTPS connections that do not name one of your domains (for example, a
# connection to the server's IP address) are refused during the TLS handshake.

# To connect to the admin control panel, you must have a domain installed on the
# EngineScript server. Once you have a domain, you can connect to the admin panel
# by going to https://admin.yourdomain.com and using the credentials you set
# during installation under the Admin Control Panel Login section.
# You can review the options you set with the console command: es.config

server {
  listen 80 deferred fastopen=256 reuseport;
  listen [::]:80 deferred fastopen=256 reuseport;
  server_name _;
  # Declares $skip_cache, which nginx.conf uses (fastcgi_cache_bypass): on a server with no
  # sites yet, this file is the only one that sets it, and Nginx refuses an undeclared variable
  fastcgi_cache off;
  set $skip_cache 1;
  return 301 https://$host$request_uri;
}

server {
  # HTTP/2
  listen 443 default_server ssl deferred fastopen=256 reuseport;
  listen [::]:443 default_server ssl deferred fastopen=256 reuseport;
  
  # HTTP/3 / QUIC
  # "reuseport" may appear only once per address and port, so only this
  # default server sets it; site vhosts use "listen 443 quic;".
  # rcvbuf and sndbuf: every HTTP/3 connection shares these two UDP sockets, and the kernel's
  # default buffer (about 208 KB) drops packets under load. 8m is the most the kernel allows
  # (net.core.rmem_max and wmem_max in 60-enginescript.conf). Site vhosts inherit the socket.
  #listen 443 default_server quic reuseport rcvbuf=8m sndbuf=8m;
  #listen [::]:443 default_server quic reuseport rcvbuf=8m sndbuf=8m;
  
  server_name _;

  # Refuse TLS handshakes for unknown or missing hostnames (SNI).
  # Requests that name a configured domain are handled by that domain's server block.
  ssl_reject_handshake on;

  # SSL Certs
  ssl_certificate /etc/nginx/ssl/localhost/localhost.crt;
  ssl_certificate_key /etc/nginx/ssl/localhost/localhost.key;

  # SSL Settings
  # The same values as sslshared.conf, which this server cannot include (it turns off
  # ssl_reject_handshake and needs a client certificate). Nginx takes some TLS settings for
  # every connection on port 443, such as the protocol versions and the session cache, from
  # this default server rather than from the site's server block, so they must match.
  ssl_buffer_size 4k;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_conf_command Options KTLS;
  ssl_ecdh_curve X25519MLKEM768:X25519:P-256:P-384;
  ssl_prefer_server_ciphers off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:5m;
  ssl_session_tickets on;
  ssl_session_timeout 6h;

  # Fallback only: every handshake is refused above, so no request reaches this server. The
  # control panel is served by the admin subdomain's vhost (admin.your-domain.conf).
  root /var/www/admin;

  # FastCGI_Cache Disable
  fastcgi_cache off;
  set $skip_cache 1;

  # Direct IP Access - Return 204 No Content
  # The HTTP 204 "No Content" response status code indicates that the server has 
  # successfully fulfilled the request, but there is no additional content to send 
  # in the response body.
  location / {
    return 204;
  }

  # Logs
  access_log off;
  #access_log /dev/null crit;
  #access_log /var/log/domains/localhost-nginx-access.log main buffer=128k flush=5m;
  error_log /var/log/domains/localhost-nginx-error.log error;
}
