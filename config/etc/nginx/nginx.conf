# EngineScript
user www-data;

worker_cpu_affinity auto;
worker_processes auto;
# Per worker: two descriptors for each of the 4096 connections (the client, and a socket to
# PHP-FPM or a cache file), plus up to 10000 files kept open by open_file_cache, with room to spare
worker_rlimit_nofile 32768;

pcre_jit on;
pid /run/nginx.pid;
#quic_bpf on; # HTTP/3

# Thread Pool
#thread_pool es_threads threads=2;

events {
  # Per worker. An idle TLS connection costs about 10-20 KB only while open; Cloudflare keeps
  # many connections open for reuse (512 per worker dropped connections under load in testing)
  worker_connections 4096;
  accept_mutex off;
  use epoll;
  multi_accept on;
}

http {
  # Main Logs
  log_format main '$remote_addr - $remote_user [$time_local] $request '
  '"$status" $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for" "$gzip_ratio"'
  '"$connection" "$connection_requests" "$request_time" $http_cf_ray '
  '$ssl_protocol $ssl_cipher';

  #log_format main_json escape=json '{'
  #  '"connection": "$connection", ' # connection serial number
  #  '"connection_requests": "$connection_requests", ' # number of requests made in connection
  #  '"remote_addr": "$remote_addr", ' # client IP
  #  '"remote_user": "$remote_user", ' # client HTTP username
  #  '"request": "$request", ' # full path no arguments if the request
  #  '"status": "$status", ' # response status code
  #  '"http_referer": "$http_referer", ' # HTTP referer
  #  '"http_user_agent": "$http_user_agent", ' # user agent
  #  '"http_x_forwarded_for": "$http_x_forwarded_for", ' # http_x_forwarded_for
  #  '"request_time": "$request_time", ' # request processing time in seconds with msec resolution
  #  '"upstream_cache_status": "$upstream_cache_status", ' # cache HIT/MISS where applicable
  #  '"ssl_protocol": "$ssl_protocol", ' # TLS protocol
  #  '"ssl_cipher": "$ssl_cipher", ' # TLS cipher
  #  '"request_method": "$request_method", ' # request method
  #  '"server_protocol": "$server_protocol", ' # request protocol, like HTTP/1.1 or HTTP/2.0
  #  '"gzip_ratio": "$gzip_ratio", '
  #  '"http_cf_ray": "$http_cf_ray", '
  #'}';

  # HTTP_Proxy exploit log
  # https://www.nginx.com/blog/mitigating-the-httpoxy-vulnerability-with-nginx
  #log_format proxylog '$remote_addr - $remote_user [$time_local] '
  #'"$request" $status $body_bytes_sent '
  #'"$http_referer" "$http_user_agent" '
  #'"$http_proxy"';
  
  # Enable the access log to record every request
  access_log off;
  #access_log /dev/null crit;
  #access_log /var/log/nginx/nginx.access.log main buffer=128k flush=5m;
  error_log /var/log/nginx/nginx.error.log warn;

  # Log requests with an HTTP_Proxy using the 'proxylog' format
  #access_log /var/log/nginx/badactor.log proxylog if=$http_proxy;

  index index.htm index.html index.php;

  include /etc/nginx/globals/mime-types.conf;

  default_type application/octet-stream;
  charset utf-8;

  # Nginx Tuning
  aio on;
  client_body_buffer_size 64k;
  client_body_in_file_only off;
  client_body_timeout 15s;
  client_header_buffer_size 2k;
  client_header_timeout 15s;
  client_max_body_size 136m; # matches PHP's post_max_size
  directio 8m;
  directio_alignment 512;
  etag on;
  http2 on;
  if_modified_since exact;
  ignore_invalid_headers on;
  keepalive_disable msie6;
  # Requests on one connection before Nginx closes it (default 1000). Cloudflare keeps its
  # connections to the origin open and sends many requests on each; every new one costs a
  # TCP and TLS handshake with the client certificate. Measured 2026-11-13: 1000, 5000, and
  # 10000 serve alike, and Nginx used less memory at 5000 than at 1000
  keepalive_requests 5000;
  # Cloudflare reuses idle connections to the origin for up to 900 seconds. Measured
  # 2026-11-13: with 75s (the default) Nginx closed the spare connections in every quiet
  # spell and the next burst reopened them; an idle connection costs about 65 KB
  keepalive_timeout 900s;
  # Longest life of one connection (the default). Measured 2026-11-13: 1m opened four times
  # the connections; a busy connection reaches keepalive_requests at about the same time
  keepalive_time 1h;
  large_client_header_buffers 4 8k;
  lingering_close on;
  lingering_time 20s;
  lingering_timeout 5s;
  log_not_found on;
  log_subrequest off;
  map_hash_bucket_size SEDHASHBUCKETSIZE;
  map_hash_max_size SEDHASHMAXSIZE;
  open_file_cache max=10000 inactive=180s;
  # Off (Nginx's default): cached "file not found" results kept new files (uploads, CSS and JS
  # that plugins generate) returning 404 for up to open_file_cache_valid
  open_file_cache_errors off;
  open_file_cache_min_uses 3;
  open_file_cache_valid 120s;
  output_buffers 2 32k;
  postpone_output 1460;
  reset_timedout_connection on;
  sendfile on;
  sendfile_max_chunk 512k;
  send_timeout 30s;
  server_names_hash_bucket_size 128;
  server_names_hash_max_size 512;
  server_name_in_redirect off;
  server_tokens off;
  tcp_nodelay on;
  tcp_nopush on;
  types_hash_bucket_size SEDHBS;
  types_hash_max_size 2048;
  variables_hash_bucket_size SEDHBS;
  variables_hash_max_size 2048;

  # Failed requests (status 400 and up), for each site's failed request log. Every map block
  # stays below map_hash_bucket_size and map_hash_max_size: Nginx fixes both at the first map
  # it reads, and then refuses the directives as duplicates (nginx -t fails).
  map $status $es_failed_request {
    ~^[45] 1;
    default 0;
  }

  # HTTP/3 - Experimental (Cloudflare does not support HTTP/3 to origin)
  #http3 on;
  # Optional HTTP/3 tuning. These stay commented so Nginx uses its defaults
  # (shown). Each HTTP/3 connection may buffer up to streams x buffer size
  # of data (128 x 64k = 8 MB), so raise them only after measuring.
  #http3_max_concurrent_streams 128;
  #http3_stream_buffer_size 64k;
  #quic_gso on;
  #quic_retry on;

  # SSL Early Data
  ssl_early_data on;

  # Response Headers
  # Added to every response. With "merge", locations that add their own headers
  # (for example Cache-Control for static files) keep these headers as well.
  add_header_inherit merge;
  include /etc/nginx/globals/response-headers.conf;

  # Maps
  include /etc/nginx/globals/map-cache.conf;
  include /etc/nginx/globals/map-expires.conf;

  # FastCGI
  # Buffers for a page read from PHP, the same on every server: nginx allocates them only as a
  # page needs them. 16 x 32k (512 KB) holds WordPress's pages, measured at 95 - 180 KB
  # uncompressed, front end and admin; a larger page goes to the visitor as it is read.
  # fastcgi_buffer_size holds the response headers (under 1 KB; plugins can send more).
  fastcgi_buffer_size 32k;
  fastcgi_buffering on;
  fastcgi_buffers 16 32k;
  fastcgi_busy_buffers_size 256k;
  fastcgi_connect_timeout 60s;
  fastcgi_ignore_client_abort off;
  fastcgi_intercept_errors off;
  # off (the default): kept connections need an upstream block with keepalive, and every idle
  # kept connection would hold one PHP-FPM worker
  fastcgi_keep_conn off;
  fastcgi_max_temp_file_size 512m;
  fastcgi_pass_header cf-edge-cache;
  fastcgi_read_timeout 130s;
  fastcgi_request_buffering on;
  fastcgi_send_timeout 60s;
  fastcgi_socket_keepalive off;
  fastcgi_temp_file_write_size 256k;

  # FastCGI cache
  # keys_zone: 1 MB holds about 8,000 cached pages. inactive is about the last request, not
  # freshness: a page nobody asked for in a day is deleted. Pages still expire after 3 hours
  # (fastcgi_cache_valid 200 3h); the expired copy stays, so a visitor gets it at once while
  # PHP refreshes it, and it is there when PHP fails. max_size: 5% of the cache disk
  # (512 MB - 10 GB); min_free shrinks the cache when the disk has less than 1 GB free.
  fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=EngineScriptWP:SEDNGINXCACHEZONEm inactive=1d max_size=SEDNGINXCACHEMAXm min_free=1g use_temp_path=off;
  fastcgi_cache_use_stale error http_500 http_503 invalid_header timeout updating;
  fastcgi_ignore_headers Expires Set-Cookie Vary X-Accel-Expires;
  fastcgi_cache_background_update on;
  fastcgi_cache_bypass $skip_cache;
  fastcgi_cache_lock on;
  fastcgi_cache_lock_age 5s;
  fastcgi_cache_lock_timeout 7s;
  fastcgi_cache_methods GET HEAD;
  fastcgi_cache_min_uses 1;
  fastcgi_cache_revalidate on;
  fastcgi_cache_valid 200 3h;
  fastcgi_cache_valid 301 302 0;
  fastcgi_cache_valid 404 10m;
  fastcgi_cache_valid 429 10s;
  fastcgi_cache_valid 499 500 502 503 505 12s;
  fastcgi_cache_valid any 10s;
  fastcgi_no_cache $skip_cache $es_no_cache_setcookie;

  # Gzip Compression
  include /etc/nginx/globals/compression-gzip.conf;

  # Brotli Compression
  include /etc/nginx/globals/compression-brotli.conf;

  # Rate Limiting
  # Second portion of rate limiting can be found in vhost .conf files in /etc/nginx/sites-enabled
  # Rate limit set to trigger HTTP code 429: Too Many Requests (Nginx).
  #limit_req_log_level warn;
  #limit_req_zone $binary_remote_addr zone=WP:10m rate=3r/s;

  # Server Default Vhost (allows web traffic to server IP)
  include /etc/nginx/admin/admin.localhost.conf;

  # Custom Global Directives
  # Add customizations that you want to run globally across all domains.
  # Your vhost .conf file also has a custom section for settings you only want to run on a single domain.
  # Upload your custom .conf files at /etc/nginx/custom-global-directives/
  include /etc/nginx/custom-global-directives/*.conf;

  # Domain Vhost Directory
  include /etc/nginx/sites-enabled/*.conf;
}

# References
# https://github.com/roots/trellis/pull/1556 - Mitigate REST API cache poisoning via Method Override
# https://github.com/roots/trellis/pull/1555 - Remove Cache-Control from fastcgi_ignore_headers
# https://github.com/roots/trellis/pull/1513 - Add X-Cache-Enabled HTTP header for WordPress Site Health
# https://github.com/roots/trellis/issues/1594 - Redirect loop on multiple sites with 1.25 (1.24)
# https://serverfault.com/questions/1153941/does-anyone-have-a-best-practices-guide-for-nginx-with-http3-quic/1172800#1172800
# https://http3check.net/
# https://easyengine.io/tutorials/wordpress/woocommerce-window-shopping-caching-technique/
