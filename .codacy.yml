---
# Codacy configuration for EngineScript.
#
# Only settings Codacy reads are here. Codacy's PHP_CodeSniffer uses its own default patterns, not
# phpcs.xml; the repository's PHP standard is checked by the Control Panel workflow (PHPCS with
# phpcs.xml, PHP-CS-Fixer for the PER Coding Style).

exclude_paths:
  # The WordPress configuration template, copied to each site; WordPress's own code style
  - 'config/var/www/wordpress/wp-config.php'
  - 'config/var/www/wordpress/**'

engines:
  # TSLint is deprecated and is switched off for this repository in Codacy,
  # yet Codacy may still run it, as it did in the plugin repositories. It is
  # turned off from here in two ways: tslint.json enables no rule, and the
  # paths below keep every file away from the tool. The two JSON files are
  # named as well, because they are what it flagged there: it asked for
  # trailing commas and sorted keys, which JSON and npm's lock file cannot
  # have. Every other tool still reads every file.
  tslint:
    exclude_paths:
      - "**"
      - "**/*"
      - "package.json"
      - "package-lock.json"

  # Lizard reads the lock files as source code and reports their length.
  # Composer and npm generate them; nobody writes them by hand.
  lizard:
    exclude_paths:
      - "composer.lock"
      - "package-lock.json"
      - "**/composer.lock"
      - "**/package-lock.json"
