---
# Codacy configuration for EngineScript.
#
# Only settings Codacy reads are here. With each tool's "Configuration file" setting on, Codacy's
# PHP_CodeSniffer, PHP Mess Detector, ESLint, markdownlint, ShellCheck, Bandit, and Stylelint read
# the repository's own files (phpcs.xml, phpmd.xml, eslint.config.mjs, .markdownlint.jsonc,
# .shellcheckrc, bandit.yml, .stylelintrc.json). phpcs.xml holds only the PHPCS standards Codacy
# installs; the Control Panel workflow runs phpcs-extra.xml, which adds PHPCSExtra's sniffs, and
# PHP-CS-Fixer for the PER Coding Style. Likewise .stylelintrc.json holds only stylelint-config-standard;
# npm run lint:css runs stylelint-browsers.json, which adds stylelint-no-unsupported-browser-features.

exclude_paths:
  # The WordPress configuration template, copied to each site; WordPress's own code style
  - 'config/var/www/wordpress/wp-config.php'
  - 'config/var/www/wordpress/**'
  # The control panel's tests: the Control Panel workflow runs and checks them, and the server suite
  # runs the integration layer. Their harness runs commands and removes temporary files on purpose
  - 'tests/**'

engines:
  # TSLint is deprecated and is switched off for this repository in Codacy,
  # yet Codacy may still run it, as it did in the plugin repositories. It is
  # turned off from here in two ways: tslint.json enables no rule, and the
  # paths below keep every file away from the tool. The two JSON files are
  # named as well, because they are what it flagged there: it asked for
  # trailing commas and sorted keys, which JSON and npm's lock file cannot
  # have. Every other tool still reads every file.
  tslint:
    exclude_paths:
      - "**"
      - "**/*"
      - "package.json"
      - "package-lock.json"

  # Lizard reads the lock files as source code and reports their length.
  # Composer and npm generate them; nobody writes them by hand.
  lizard:
    exclude_paths:
      - "composer.lock"
      - "package-lock.json"
      - "**/composer.lock"
      - "**/package-lock.json"
