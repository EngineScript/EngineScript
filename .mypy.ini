[mypy]
# Type-check the Python scripts at the strictest level: the automation scripts in .github/scripts,
# and the site archive's ZIP tool, which runs on servers.
strict = True
warn_unreachable = True
scripts_are_modules = True
files = .github/scripts/check-deployment-surface.py, .github/scripts/test-automation.py, scripts/functions/shared/site-archive-zip.py
