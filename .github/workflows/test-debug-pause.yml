name: Test Debug Pause

"on":
  push:
    branches:
      - master
    paths:
      - 'scripts/functions/shared/enginescript-common.sh'
      - 'scripts/ci/test-debug-pause.sh'
      - '.github/workflows/test-debug-pause.yml'
  pull_request:
    paths:
      - 'scripts/functions/shared/enginescript-common.sh'
      - 'scripts/ci/test-debug-pause.sh'
      - '.github/workflows/test-debug-pause.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-debug-pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run debug pause tests
        run: |
          bash -n scripts/ci/test-debug-pause.sh
          bash scripts/ci/test-debug-pause.sh
