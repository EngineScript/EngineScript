name: Test Cloudflare API Results

"on":
  push:
    branches:
      - master
    paths:
      - 'scripts/functions/shared/enginescript-shared-vhost.sh'
      - 'scripts/ci/test-cloudflare-api.sh'
      - '.github/workflows/test-cloudflare-api.yml'
  pull_request:
    paths:
      - 'scripts/functions/shared/enginescript-shared-vhost.sh'
      - 'scripts/ci/test-cloudflare-api.sh'
      - '.github/workflows/test-cloudflare-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cloudflare-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Cloudflare API result tests
        run: |
          bash -n scripts/ci/test-cloudflare-api.sh
          bash scripts/ci/test-cloudflare-api.sh
