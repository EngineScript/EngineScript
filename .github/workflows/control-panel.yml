  unit-coverage:
    name: Unit Test Coverage (PHP 8.4)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    env:
      # The unit suite must cover at least this share of the panel's PHP lines: set a few points
      # below the measured 50.25 % (503 of 1,001 lines, 2026-11-14). api.php and the controllers
      # that read the server's files are the integration suite's (tests/integration, D-075).
      MINIMUM_LINE_COVERAGE: '66'
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests with coverage
        id: run_unit_tests_with_coverage
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          vendor/bin/phpunit --version
          vendor/bin/phpunit --configuration phpunit.xml --testsuite unit --fail-on-empty-test-suite \
            --coverage-text="$RUNNER_TEMP/es-diagnostics/coverage.txt" \
            --coverage-clover "$RUNNER_TEMP/es-diagnostics/clover.xml"
          cat "$RUNNER_TEMP/es-diagnostics/coverage.txt"

      - name: Check line coverage
        id: check_line_coverage
        run: |
          php -r '
            $xml = simplexml_load_file($argv[1]);
            $metrics = $xml->project->metrics;
            $lines = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            if ($lines === 0) {
                fwrite(STDERR, "::error::The coverage report lists no production lines.\n");
                exit(1);
            }
            $percent = 100 * $covered / $lines;
            printf("Line coverage: %.2f%% (%d of %d lines); minimum %s%%.\n", $percent, $covered, $lines, $argv[2]);
            if ($percent < (float) $argv[2]) {
                fwrite(STDERR, "::error::Unit test line coverage is below the minimum.\n");
                exit(1);
            }
          ' "$RUNNER_TEMP/es-diagnostics/clover.xml" "$MINIMUM_LINE_COVERAGE"

      - name: Upload coverage to Codacy
        id: upload_coverage
        # Dependabot's and forks' pull requests get no secrets, so they skip the upload. A failed
        # upload fails the job on pushes; on a pull request it is reported without blocking it.
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          # Codacy's coverage reporter, pinned: update the version and the SHA-512 together, from
          # the release's codacy-coverage-reporter-linux.SHA512SUM file
          # (https://github.com/codacy/codacy-coverage-reporter/releases). Dependabot does not track it.
          CODACY_REPORTER_VERSION: '14.1.3'
          CODACY_REPORTER_SHA512: '73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17'
          # Codacy analyzes a pull request's head commit, not the merge commit GitHub checks out
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::The CODACY_PROJECT_TOKEN secret is not set, so Codacy cannot receive this commit's coverage."
            exit 1
          fi
          reporter="$RUNNER_TEMP/codacy-coverage-reporter"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 --output "$reporter" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/$CODACY_REPORTER_VERSION/codacy-coverage-reporter-linux"
          echo "$CODACY_REPORTER_SHA512  $reporter" | sha512sum --check --strict -
          chmod +x "$reporter"
          "$reporter" report --commit-uuid "$COMMIT_SHA" -r "$RUNNER_TEMP/es-diagnostics/clover.xml"

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_unit_tests_with_coverage=${{ steps.run_unit_tests_with_coverage.outcome }}
            check_line_coverage=${{ steps.check_line_coverage.outcome }}
            upload_coverage=${{ steps.upload_coverage.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-unit-coverage
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_unit_tests_with_coverage.outcome == 'failure' && 'run_unit_tests_with_coverage' || steps.check_line_coverage.outcome == 'failure' && 'check_line_coverage' || steps.upload_coverage.outcome == 'failure' && 'upload_coverage' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.4'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/unit-coverage-failure.md
          update_existing: false

  php-version-test:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 20
    strategy:
      # The supported PHP versions, with the locked dependencies, plus the lowest versions
      # composer.json allows at the minimum PHP version
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        dependency-versions: ['locked']
        include:
          - php-version: '8.3'
            dependency-versions: 'lowest'
      fail-fast: false
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php-version }}
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: PHP syntax check
        id: php_syntax
        run: |
          mapfile -d '' -t PHP_FILES < <(git ls-files -z -- 'config/var/www/admin/*.php' 'tests/*.php')
          for file in "${PHP_FILES[@]}"; do
            php -l "$file" > /dev/null || exit 1
          done
          echo "${#PHP_FILES[@]} files parse."

      - name: Install Composer dependencies (${{ matrix.dependency-versions }})
        id: install_composer_dependencies
        env:
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
        run: |
          if [ "$DEPENDENCY_VERSIONS" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
          else
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Run the unit suite
        id: run_unit_tests
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite unit --fail-on-empty-test-suite

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            php_syntax=${{ steps.php_syntax.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_unit_tests=${{ steps.run_unit_tests.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-php-version-test-${{ matrix.php-version }}-${{ matrix.dependency-versions }}
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.php_syntax.outcome == 'failure' && 'php_syntax' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_unit_tests.outcome == 'failure' && 'run_unit_tests' || 'unknown_or_canceled' }}
          PHP_VERSION: '${{ matrix.php-version }}'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/php-version-test-failure.md
          update_existing: false

  control-panel-checks:
    name: Control Panel checks
    needs: [changes, phpcs, phpmd, psalm-analysis, security-check, phpstan, rector, javascript-tests, lint, unit-coverage, php-version-test]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          # The one required status check on master: a job skipped because the panel's files did
          # not change counts as passed; a failed or cancelled job fails this one
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
