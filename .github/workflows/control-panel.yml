name: Control Panel

# The control panel's checks, in the job layout of the EngineScript plugin repositories'
# wp-compatibility-test.yml (D-001, D-071), without their WordPress jobs:
# - PHPCS with PHPCompatibility, and PHP-CS-Fixer for the PER Coding Style
# - PHPMD, Psalm with taint analysis, PHPStan, and a Rector dry run
# - dependency vulnerabilities and a scan of the panel's own PHP for unsafe calls
# - the JavaScript tests (tests/js), with a no-test check and an intentionally failing control
# - YAML, workflow, Python, Markdown, JavaScript, CSS, and HTML linting (yamllint, actionlint,
#   zizmor, Ruff, mypy, markdownlint, ESLint, Stylelint, html-validate), with modern-JavaScript
#   rules and checks against the supported browsers; the repository script tests and the
#   deployment check
# - unit test line coverage with a minimum, and the unit suite on every supported PHP version
# The integration suite (tests/integration) runs on a real EngineScript server, a container of
# the local server test suite, not here (D-075). Each job files an issue when it fails on master.
# On a pull request, "changes" runs first and the checks run only when the panel's files changed;
# "Control Panel checks" runs last and is the one required status check on master (Q-003).

"on":
  push:
    branches:
      - master
    paths:
      - 'config/var/www/admin/**'
      - '**/*.md'
      - 'tests/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - 'eslint.config.mjs'
      - '.stylelintrc.json'
      - 'stylelint-browsers.json'
      - '.htmlvalidate.json'
      - '.markdownlint-cli2.jsonc'
      - '.markdownlint.jsonc'
      - '.php-cs-fixer.dist.php'
      - 'phpcs.xml'
      - 'phpcs-extra.xml'
      - 'rector.php'
      - 'phpmd.xml'
      - 'phpstan.neon'
      - 'psalm.xml'
      - 'phpunit.xml'
      - '.ruff.toml'
      - '.mypy.ini'
      - 'scripts/functions/shared/site-archive-zip.py'
      - '.yamllint.yml'
  # Every pull request: the "changes" job below skips the checks when none of the push paths
  # changed, so the required check ("Control Panel checks") still reports
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the panel's files changed
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push is filtered by the trigger's paths, and a manual run checks everything
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=false
          while IFS= read -r file; do
            # The push trigger's paths (test-automation.py keeps the two lists equal)
            case "$file" in
              config/var/www/admin/*|*.md|tests/*|.github/*|package.json|package-lock.json|composer.json|composer.lock|eslint.config.mjs|.stylelintrc.json|stylelint-browsers.json|.htmlvalidate.json|.markdownlint-cli2.jsonc|.markdownlint.jsonc|.php-cs-fixer.dist.php|phpcs.xml|phpcs-extra.xml|rector.php|phpmd.xml|phpstan.neon|psalm.xml|phpunit.xml|.ruff.toml|.mypy.ini|scripts/functions/shared/site-archive-zip.py|.yamllint.yml)
                relevant=true
                ;;
              *)
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  phpcs:
    name: PHPCS (PHP 8.3)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          # 8.3 is the control panel's minimum version (composer.json's platform)
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHPCS standards
        id: verify_phpcs_standards
        run: vendor/bin/phpcs -i

      # PHPCS fails until Phase 16 resolves its findings (missing namespaces, line length; D-076)
      - name: Run PHPCS
        id: run_phpcs
        run: |
          vendor/bin/phpcs --standard=phpcs-extra.xml

          # Static scanner controls; never execute these PHP fixtures.
          CONTROL_DIR="$RUNNER_TEMP/es-compat-controls"
          mkdir -p "$CONTROL_DIR"
          printf '<?php strlen("control");\n' > "$CONTROL_DIR/compatible.php"
          printf '<?php each(array());\n' > "$CONTROL_DIR/legacy-incompatible.php"
          vendor/bin/phpcs --standard=PHPCompatibility --runtime-set testVersion 8.3 "$CONTROL_DIR/compatible.php"
          if vendor/bin/phpcs --standard=PHPCompatibility --runtime-set testVersion 8.3 "$CONTROL_DIR/legacy-incompatible.php"; then
            echo '::error::The known legacy-incompatible fixture was missed.'
            exit 1
          fi

      # PHP-CS-Fixer checks the PER Coding Style (D-012); it ran in the earlier composer job
      - name: PHP-CS-Fixer
        id: php_cs_fixer
        if: ${{ !cancelled() && steps.install_composer_dependencies.outcome == 'success' }}
        run: composer cs:check

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            verify_phpcs_standards=${{ steps.verify_phpcs_standards.outcome }}
            run_phpcs=${{ steps.run_phpcs.outcome }}
            php_cs_fixer=${{ steps.php_cs_fixer.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-phpcs
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.verify_phpcs_standards.outcome == 'failure' && 'verify_phpcs_standards' || steps.run_phpcs.outcome == 'failure' && 'run_phpcs' || steps.php_cs_fixer.outcome == 'failure' && 'php_cs_fixer' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/phpcs-failure.md
          update_existing: false

  phpmd:
    name: PHPMD (PHP 8.3)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify phpmd.xml content
        id: verify_phpmd_xml
        run: test -s phpmd.xml && grep -q '<ruleset' phpmd.xml

      # PHPMD scans config/var/www/admin only, so tests/ is never in its path; it fails until
      # Phase 16 resolves its naming findings (D-076)
      - name: Run PHPMD
        id: run_phpmd
        run: composer phpmd

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            verify_phpmd_xml=${{ steps.verify_phpmd_xml.outcome }}
            run_phpmd=${{ steps.run_phpmd.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-phpmd
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.verify_phpmd_xml.outcome == 'failure' && 'verify_phpmd_xml' || steps.run_phpmd.outcome == 'failure' && 'run_phpmd' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/phpmd-failure.md
          update_existing: false

  psalm-analysis:
    name: Psalm Static Analysis (PHP 8.3)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Psalm installation
        id: verify_psalm
        run: vendor/bin/psalm --version

      - name: Run Psalm
        id: run_psalm
        run: composer psalm -- --no-cache

      # It ran in the earlier composer job
      - name: Run Psalm taint analysis
        id: run_psalm_taint
        if: ${{ !cancelled() && steps.install_composer_dependencies.outcome == 'success' }}
        run: composer psalm:taint

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            verify_psalm=${{ steps.verify_psalm.outcome }}
            run_psalm=${{ steps.run_psalm.outcome }}
            run_psalm_taint=${{ steps.run_psalm_taint.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-psalm-analysis
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.verify_psalm.outcome == 'failure' && 'verify_psalm' || steps.run_psalm.outcome == 'failure' && 'run_psalm' || steps.run_psalm_taint.outcome == 'failure' && 'run_psalm_taint' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/psalm-failure.md
          update_existing: false

  security-check:
    name: Security Scan (PHP 8.3)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security Check for known vulnerabilities in dependencies
        id: security_checker
        uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5  # v5

      # The control panel's own code: no shell, eval, unserialize, or include of a computed path.
      # The two allowed uses are the panel's command runner (proc_open with an argv array) and
      # Request/Session, the one place that reads superglobals. Comment lines are skipped.
      - name: Control panel security scan
        id: panel_security_scan
        run: |
          PANEL=config/var/www/admin/control-panel
          status=0
          if grep -rnE '^[^*/#]*(\b(eval|assert|create_function|shell_exec|system|passthru|popen|pcntl_exec)\s*\(|\bexec\s*\(|`[^`]*\$)' --include='*.php' "$PANEL"; then
            echo '::error::Shell or code execution outside the command runner.'
            status=1
          fi
          if grep -rnE '^[^*/#]*\bunserialize\s*\(' --include='*.php' "$PANEL"; then
            echo '::error::unserialize() on panel data.'
            status=1
          fi
          if grep -rnE '^[^*/#]*\b(include|require)(_once)?\s*\(?\s*\$' --include='*.php' "$PANEL"; then
            echo '::error::An include or require of a computed path.'
            status=1
          fi
          if grep -rnlE '^[^*/#]*proc_open\s*\(' --include='*.php' "$PANEL" | grep -v 'classes/SystemProcessRunner.php$'; then
            echo '::error::proc_open() outside SystemProcessRunner.'
            status=1
          fi
          if grep -rnlE '^[^*/#]*\$_(GET|POST|REQUEST|COOKIE|SERVER|FILES|SESSION)\b' --include='*.php' "$PANEL" | grep -vE 'classes/(Request|Session)\.php$'; then
            echo '::error::A superglobal read outside Request or Session.'
            status=1
          fi
          exit "$status"

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            security_checker=${{ steps.security_checker.outcome }}
            panel_security_scan=${{ steps.panel_security_scan.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-panel-security-check
          path: ${{ runner.temp }}/es-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on failure
        id: create_issue_on_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.security_checker.outcome == 'failure' && 'security_checker' || steps.panel_security_scan.outcome == 'failure' && 'panel_security_scan' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/security-failure.md
          update_existing: false

  phpstan:
    name: PHPStan (PHP 8.3)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
