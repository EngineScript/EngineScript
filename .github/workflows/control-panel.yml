    name: Lint (Node 24)
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write  # the job files an issue when it fails on master
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      # --ignore-scripts: no package's install scripts run in CI; none of the checks needs them.
      # npm ci also fails when package.json and package-lock.json disagree (D-072).
      - name: Install npm dependencies
        id: install_npm_dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Python 3.12
        id: setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # A virtual environment holds the versions that .github/lint-requirements.txt pins
      - name: Install the pinned linters
        id: install_linters
        run: |
          python -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --disable-pip-version-check --quiet \
            --requirement .github/lint-requirements.txt
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"

      # Each check runs even when an earlier one failed, so one run reports every problem.
      # ESLint carries the modern-JavaScript rules (eslint-plugin-unicorn) and checks the shipped
      # scripts against the supported browsers (eslint-plugin-compat); Stylelint checks the CSS
      # against them (stylelint-no-unsupported-browser-features). That plugin is in
      # stylelint-browsers.json, which npm run lint:css uses; it extends .stylelintrc.json, which
      # Codacy reads and so may use only the packages Codacy installs.
      - name: ESLint
        id: eslint
        if: ${{ !cancelled() && steps.install_npm_dependencies.outcome == 'success' }}
        run: npm run lint:js

      - name: Stylelint
        id: stylelint
        if: ${{ !cancelled() && steps.install_npm_dependencies.outcome == 'success' }}
        run: npm run lint:css

      - name: html-validate
        id: html_validate
        if: ${{ !cancelled() && steps.install_npm_dependencies.outcome == 'success' }}
        run: npm run lint:html

      - name: markdownlint
        id: markdownlint
        if: ${{ !cancelled() && steps.install_npm_dependencies.outcome == 'success' }}
        run: npm run lint:md

      - name: Ruff
        id: ruff
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' }}
        run: |
          ruff check .github/scripts scripts/functions/shared/site-archive-zip.py
          ruff format --check .github/scripts scripts/functions/shared/site-archive-zip.py

      - name: mypy (strict)
        id: mypy
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' }}
        run: mypy

      - name: Repository script tests
        id: script_tests
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-automation.py

      - name: Deployed control panel files match the allowlist
        id: deployment_surface
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-deployment-surface.py

      - name: yamllint
        id: yamllint
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' }}
        run: |
          # Tracked files only, so installed dependencies are left out
          mapfile -d '' -t YAML_FILES < <(git ls-files -z -- '*.yml' '*.yaml')
          yamllint -c .yamllint.yml "${YAML_FILES[@]}"

      # actionlint's ShellCheck pass is off: on the largest workflows it runs for a very long
      # time, so the shell in run: blocks is not checked here
      - name: actionlint
        id: actionlint
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' }}
        run: actionlint -shellcheck=

      - name: zizmor
        id: zizmor
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' }}
        run: zizmor --offline .github/workflows

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_node=${{ steps.setup_node.outcome }}
            install_npm_dependencies=${{ steps.install_npm_dependencies.outcome }}
            setup_python=${{ steps.setup_python.outcome }}
            install_linters=${{ steps.install_linters.outcome }}
            eslint=${{ steps.eslint.outcome }}
            stylelint=${{ steps.stylelint.outcome }}
            html_validate=${{ steps.html_validate.outcome }}
            markdownlint=${{ steps.markdownlint.outcome }}
            ruff=${{ steps.ruff.outcome }}
            mypy=${{ steps.mypy.outcome }}
            script_tests=${{ steps.script_tests.outcome }}
            deployment_surface=${{ steps.deployment_surface.outcome }}
            yamllint=${{ steps.yamllint.outcome }}
            actionlint=${{ steps.actionlint.outcome }}
            zizmor=${{ steps.zizmor.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-diagnostics/run.txt"
          if command -v php > /dev/null; then php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-diagnostics/php.txt"; fi
          if command -v node > /dev/null; then node --version > "$RUNNER_TEMP/es-diagnostics/node.txt"; fi
          if [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-diagnostics/dependencies.txt"
          fi
          # Never upload configuration, credentials, or logs; refuse oversized or linked files.
          find "$RUNNER_TEMP/es-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
