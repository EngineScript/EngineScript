name: Test Nginx Unsafe Files

"on":
  push:
    branches:
      - master
    paths:
      - 'scripts/install/nginx/nginx-misc.sh'
      - 'scripts/ci/test-nginx-unsafe-files.sh'
      - 'config/etc/nginx/globals/map-cache.conf'
      - '.github/workflows/test-nginx-unsafe-files.yml'
  pull_request:
    paths:
      - 'scripts/install/nginx/nginx-misc.sh'
      - 'scripts/ci/test-nginx-unsafe-files.sh'
      - 'config/etc/nginx/globals/map-cache.conf'
      - '.github/workflows/test-nginx-unsafe-files.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nginx-unsafe-files:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Nginx unsafe file tests
        run: |
          bash -n scripts/ci/test-nginx-unsafe-files.sh
          bash scripts/ci/test-nginx-unsafe-files.sh
